<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATM Machine</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="atm" aria-labelledby="page-title">
    <section class="screen">
      <p class="bank-name">SECURE BANK</p>
      <h1 id="page-title">ATM Machine</h1>
      <p class="balance-label">Available balance</p>
      <p id="balance" class="balance" aria-live="polite">$1,000.00</p>
      <p id="message" class="message" aria-live="polite">Choose a transaction below.</p>
    </section>

    <section class="controls" aria-label="ATM transaction controls">
      <label for="amount">Amount</label>
      <div class="amount-field">
        <span>$</span>
        <input id="amount" type="number" min="0.01" step="0.01" placeholder="Enter amount">
      </div>
      <div class="actions">
        <button id="withdraw" class="danger" type="button">Withdraw</button>
        <button id="deposit" class="success" type="button">Deposit</button>
        <button id="check-balance" type="button">Check Balance</button>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
